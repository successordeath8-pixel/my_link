<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Models — Private Gallery</title>
    
    <!-- Optimización de Cloudflare: Precarga la conexión al destino -->
    <link rel="preconnect" href="https://goddessgridhq.com">
    <link rel="dns-prefetch" href="https://goddessgridhq.com">

    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.2rem 1rem;
        }
        .header {
            text-align: center;
            max-width: 700px;
            margin-bottom: 1rem;
        }
        .header .badge {
            display: inline-block;
            font-size: 0.7rem;
            background: #d4af37;
            color: #000000;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 800;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .header h1 {
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 800;
            margin-bottom: 0.3rem;
            color: #d4af37;
        }
        .header p {
            color: #c5c5c5;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .gallery-container {
            width: 100%;
            max-width: 400px;
            background: #0d0d0d;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 0.8rem;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
            margin-bottom: 1rem;
        }
        .gallery-main {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
        }
        .gallery-main .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            color: #d4af37;
            border: 1px solid #d4af37;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .gallery-main .nav:hover { 
            background: rgba(212, 175, 55, 0.2); 
        }
        .gallery-main .nav.prev { 
            left: 10px; 
        }
        .gallery-main .nav.next { 
            right: 10px; 
        }
        .gallery-counter {
            position: absolute;
            bottom: 10px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #d4af37;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            color: #d4af37;
            font-weight: 600;
            z-index: 10;
        }
        .cta-box {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        /* Botón convertido en etiqueta <a> con enlace directo para máxima velocidad */
        .btn-enter {
            display: block;
            width: 100%;
            padding: 1rem 1rem;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000000;
            border: none;
            border-radius: 999px;
            font-weight: 800;
            font-size: clamp(0.75rem, 3.8vw, 1.05rem); 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.6);
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="badge">🔥 VIP Access • Uncensored</span>
        <h1>Exclusive Creators Private Gallery</h1>
        <p>Unlock exclusive, uncensored content from our top creators of the moment.</p>
    </div>

    <div class="gallery-container">
        <div class="gallery-main">
            <button class="nav prev" onclick="changeImage(-1)">‹</button>
            <img id="main-image" src="" alt="Preview Model">
            <button class="nav next" onclick="changeImage(1)">›</button>
            <div class="gallery-counter"><span id="counter">1 / 10</span></div>
        </div>
    </div>

    <div class="cta-box">
        <!-- Enlace HTML directo recomendado por Cloudflare -->
        <a href="https://goddessgridhq.com" class="btn-enter">Confirm 18+ & Watch Now Free 🔓</a>
    </div>

    <script>
        const IMAGES = Array.from({length: 10}, (_, i) => `img/${String(i + 1).padStart(2, '0')}.jpg`);
        let current = 0;
        let autoTimer = null;
        const ROTATE_INTERVAL = 3000;
        
        const preloadedImages = [];
        function preloadAll() {
            IMAGES.forEach(src => {
                const img = new Image();
                img.src = src;
                preloadedImages.push(img);
            });
        }

        function initGallery() {
            showImage(0);
            startAutoRotate();
            preloadAll();
        }

        function showImage(index) {
            current = (index + IMAGES.length) % IMAGES.length;
            const mainImg = document.getElementById("main-image");
            mainImg.src = IMAGES[current];
            document.getElementById("counter").textContent = `${current + 1} / ${IMAGES.length}`;
        }

        function changeImage(dir) {
            showImage(current + dir);
            restartAutoRotate();
        }

        function startAutoRotate() {
            autoTimer = setInterval(() => showImage(current + 1), ROTATE_INTERVAL);
        }

        function restartAutoRotate() {
            clearInterval(autoTimer);
            startAutoRotate();
        }

        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
